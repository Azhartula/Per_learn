[project]
name = "personalized-learning-loop"
version = "0.1.0"
description = "Phase 1: bandit simulation for teaching-method personalization"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0.2",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "scipy>=1.11",
  "scikit-learn>=1.4,<1.6",
  "sympy>=1.12",
]

[tool.setuptools.packages.find]
where = ["src"]
